name: garden
services:
  garden:
    build:
      context: .
      args:
        APP_UID: 1120 # Leave blank if you don't care about the uid/gid.
    image: garden:latest
    pull_policy: build
    container_name: garden_web
    volumes:
      - static:/app/static
      - data:/data
    environment:
      - DJANGO_SETTINGS_MODULE=conf.settings
      - SITE_NAME=Electric Garden
      - ALLOWED_HOSTS=garden.afork.com,localhost
      # For a top-level site (e.g. garden.afork.com/):
      - SCRIPT_NAME=
      # For a subpath site (e.g. vps.afork.com/garden):
      # - SCRIPT_NAME=/garden
      - CSRF_TRUSTED_ORIGINS=https://garden.afork.com
      - EMAIL_DEFAULT_FROM=noreply@afork.com
      - EMAIL_HOST=
      - EMAIL_PORT=
      - EMAIL_HOST_USER=
      - EMAIL_HOST_PASSWORD=
      - DBBACKUP_HOSTNAME=garden
      # Shared secret for the Google Sheets webhook (App Script -> Django).
      # Set this to the same value used in the Apps Script project.
      # See .env.template for how to generate it
      - SHEETS_WEBHOOK_API_KEY=CHANGE_ME
    networks:
      - shared_docker_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Top-level site: Host(`garden.afork.com`)
      # Subpath site:   Host(`vps.afork.com`) && PathPrefix(`/garden`)
      - "traefik.http.routers.garden.rule=Host(`garden.afork.com`)"
      - "traefik.http.routers.garden.entrypoints=websecure"
      - "traefik.http.routers.garden.tls=true"
      - "traefik.http.routers.garden.tls.certresolver=letsencrypt"
      - "traefik.http.services.garden.loadbalancer.server.port=8000"

volumes:
  static:
  data:

networks:
  shared_docker_network:
    external: true
